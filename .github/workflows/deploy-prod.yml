name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to latest)'
        required: false
        default: 'latest'

env:
  # Azure Container Registry name
  REGISTRY_NAME: travelhands-ecaweffuhmhcgyh5
  # Registry URL
  REGISTRY_URL: travelhands-ecaweffuhmhcgyh5.azurecr.io
  # Azure Container Apps name for production
  CONTAINER_APP_NAME: voice-agent-prod
  # Container App ENV
  CONTAINER_APP_ENV: todo
  # Azure Resource Group name for production
  RESOURCE_GROUP: th-voice-agent-prod
  # Container image name
  IMAGE_NAME: voice-agent

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate environment variables
      run: |
        echo "Validating required secrets..."

        if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
          echo "::error::Required secret AZURE_CREDENTIALS is not set"
          exit 1
        fi

        if [ -z "${{ secrets.AZURE_OPENAI_ENDPOINT_PROD }}" ]; then
          echo "::error::Required secret AZURE_OPENAI_ENDPOINT_PROD is not set"
          exit 1
        fi

        if [ -z "${{ secrets.AZURE_OPENAI_API_KEY_PROD }}" ]; then
          echo "::error::Required secret AZURE_OPENAI_API_KEY_PROD is not set"
          exit 1
        fi

        if [ -z "${{ secrets.AZURE_SPEECH_REGION_PROD }}" ]; then
          echo "::error::Required secret AZURE_SPEECH_REGION_PROD is not set"
          exit 1
        fi

        if [ -z "${{ secrets.AZURE_OPENAI_API_VERSION_PROD }}" ]; then
          echo "::error::Required secret AZURE_OPENAI_API_VERSION_PROD is not set"
          exit 1
        fi

        if [ -z "${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME_PROD }}" ]; then
          echo "::error::Required secret AZURE_OPENAI_DEPLOYMENT_NAME_PROD is not set"
          exit 1
        fi

        echo "All required secrets are set"

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Container Apps
      run: |
        az containerapp update \
          --name ${{ env.CONTAINER_APP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest \
          --replace-env-vars "AZURE_OPENAI_ENDPOINT=${{ secrets.AZURE_OPENAI_ENDPOINT_PROD }}" \
            "AZURE_SPEECH_REGION=${{ secrets.AZURE_SPEECH_REGION_PROD }}" \
            "AZURE_OPENAI_API_KEY=${{ secrets.AZURE_OPENAI_API_KEY_PROD }}" \
            "AZURE_OPENAI_API_VERSION=${{ secrets.AZURE_OPENAI_API_VERSION_PROD }}" \
            "AZURE_OPENAI_DEPLOYMENT_NAME=${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME_PROD }}"
