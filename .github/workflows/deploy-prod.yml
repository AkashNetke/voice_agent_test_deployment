name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # Azure Container Registry name
  REGISTRY_NAME: travelhands-ecaweffuhmhcgyh5
  # Registry URL
  REGISTRY_URL: travelhands-ecaweffuhmhcgyh5.azurecr.io
  # Azure Container Apps name for production
  CONTAINER_APP_NAME: voice-agent-prod
  # Container App ENV
  CONTAINER_APP_ENV: todo
  # Azure Resource Group name for production
  RESOURCE_GROUP: th-voice-agent
  # Container image name
  IMAGE_NAME: voice-agent

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate environment variables
      run: |
        echo "Validating required secrets..."

        if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
          echo "::error::Required secret AZURE_CREDENTIALS is not set"
          exit 1
        fi

        if [ -z "${{ secrets.AZURE_SPEECH_KEY_PROD }}" ]; then
          echo "::error::Required secret AZURE_SPEECH_KEY_PROD is not set"
          exit 1
        fi

        if [ -z "${{ secrets.AZURE_SPEECH_REGION_PROD }}" ]; then
          echo "::error::Required secret AZURE_SPEECH_REGION_PROD is not set"
          exit 1
        fi

        if [ -z "${{ secrets.AZURE_OPENAI_ENDPOINT_PROD }}" ]; then
          echo "::error::Required secret AZURE_OPENAI_ENDPOINT_PROD is not set"
          exit 1
        fi

        if [ -z "${{ secrets.AZURE_OPENAI_API_KEY_PROD }}" ]; then
          echo "::error::Required secret AZURE_OPENAI_API_KEY_PROD is not set"
          exit 1
        fi

        if [ -z "${{ secrets.AZURE_OPENAI_API_VERSION_PROD }}" ]; then
          echo "::error::Required secret AZURE_OPENAI_API_VERSION_PROD is not set"
          exit 1
        fi

        if [ -z "${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME_PROD }}" ]; then
          echo "::error::Required secret AZURE_OPENAI_DEPLOYMENT_NAME_PROD is not set"
          exit 1
        fi

        if [ -z "${{ secrets.COSMOS_DB_ENDPOINT_PROD }}" ]; then
          echo "::error::Required secret COSMOS_DB_ENDPOINT_PROD is not set"
          exit 1
        fi

        if [ -z "${{ secrets.COSMOS_DB_KEY_PROD }}" ]; then
          echo "::error::Required secret COSMOS_DB_KEY_PROD is not set"
          exit 1
        fi

        if [ -z "${{ secrets.COSMOS_DB_DATABASE_PROD }}" ]; then
          echo "::error::Required secret COSMOS_DB_DATABASE_PROD is not set"
          exit 1
        fi

        if [ -z "${{ secrets.COSMOS_CHAT_MESSAGE_CONTAINER_PROD }}" ]; then
          echo "::error::Required secret COSMOS_CHAT_MESSAGE_CONTAINER_PROD is not set"
          exit 1
        fi

        if [ -z "${{ secrets.LOG_LEVEL_PROD }}" ]; then
          echo "::error::Required secret LOG_LEVEL_PROD is not set"
          exit 1
        fi

        if [ -z "${{ secrets.TRAVEL_HANDS_API_BASE_URL_PROD }}" ]; then
          echo "::error::Required secret TRAVEL_HANDS_API_BASE_URL_PROD is not set"
          exit 1
        fi

        echo "All required secrets are set"

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Container Apps
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)

        az containerapp update \
          --name ${{ env.CONTAINER_APP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest \
          --revision-suffix $SHORT_SHA \
          --replace-env-vars "AZURE_SPEECH_KEY=${{ secrets.AZURE_SPEECH_KEY_PROD }}" \
            "AZURE_SPEECH_REGION=${{ secrets.AZURE_SPEECH_REGION_PROD }}" \
            "AZURE_OPENAI_ENDPOINT=${{ secrets.AZURE_OPENAI_ENDPOINT_PROD }}" \
            "AZURE_OPENAI_API_KEY=${{ secrets.AZURE_OPENAI_API_KEY_PROD }}" \
            "AZURE_OPENAI_API_VERSION=${{ secrets.AZURE_OPENAI_API_VERSION_PROD }}" \
            "AZURE_OPENAI_DEPLOYMENT_NAME=${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME_PROD }}" \
            "COSMOS_DB_ENDPOINT=${{ secrets.COSMOS_DB_ENDPOINT_PROD }}" \
            "COSMOS_DB_KEY=${{ secrets.COSMOS_DB_KEY_PROD }}" \
            "COSMOS_DB_DATABASE=${{ secrets.COSMOS_DB_DATABASE_PROD }}" \
            "COSMOS_CHAT_MESSAGE_CONTAINER=${{ secrets.COSMOS_CHAT_MESSAGE_CONTAINER_PROD }}" \
            "LOG_LEVEL=${{ secrets.LOG_LEVEL_PROD }}" \
            "TRAVEL_HANDS_API_BASE_URL=${{ secrets.TRAVEL_HANDS_API_BASE_URL_PROD }}"
