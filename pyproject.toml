[tool.poetry]
name = "voice-agent"
version = "0.1.0"
description = "Voice Agent for Journey Booking"
authors = ["Your Name <you@example.com>"]
packages = [
    { include = "voice_agent", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.9"
azure-cognitiveservices-speech = "^1.45.0"
python-dotenv = "^1.1.1"
langchain = "^0.3.0"
langchain-openai = "^0.3.32"
requests = "^2.32.5"
python-dateutil = "^2.9.0"
fastapi = "^0.116.1"
uvicorn = {extras = ["standard"], version = "^0.35.0"}
pydantic = "^2.11.7"
"azure-cosmos" = "^4.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
httpx = "^0.28.1"
black = "^24.10.0"
isort = "^6.0.1"
mypy = "^1.17.1"
ruff = "^0.4.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"

[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88
